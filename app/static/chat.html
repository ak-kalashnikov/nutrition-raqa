<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nutrition RAQA — Chat</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      Nutrition &amp; Sports Health — Ask anything
    </header>
    <div class="chat-disclaimer">
      Educational use only — not medical advice. For symptoms, diagnoses, or emergencies,
      please contact a licensed health professional or local emergency services.
    </div>
    <main id="messages" class="chat-messages"></main>
    <form id="chat-form" class="chat-form">
      <textarea id="prompt" placeholder="Ask about nutrition, training, recovery..." rows="1"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
