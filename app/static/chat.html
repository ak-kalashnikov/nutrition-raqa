<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <link rel="stylesheet" href="/static/chat.css?v=9">
</head>
<body>
  <header class="topbar">
    <div class="model-wrap">
      <button type="button" id="model-btn" class="model-btn" aria-haspopup="listbox" aria-expanded="false">Models</button>
      <div id="model-menu" class="model-menu" hidden role="listbox" aria-label="Models"></div>
    </div>
  </header>

  <main class="stage">
    <div id="empty" class="empty">How can I help you? Ask a nutrition question, or tell me what you want to figure out.</div>
    <div id="messages" class="thread" role="log" aria-live="polite"></div>
  </main>

  <form id="chat-form" class="dock">
    <div class="box">
      <label class="sr-only" for="prompt">Message</label>
      <textarea id="prompt" rows="1" placeholder="Message" autocomplete="off"></textarea>
      <button type="submit" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <p class="fine">Educational only. Not a medical device and not for diagnosis, treatment, or emergencies.</p>
    <p id="llm-note" class="fine"></p>
  </form>
  <script src="/static/chat.js?v=9"></script>
</body>
</html>
