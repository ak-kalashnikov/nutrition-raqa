name: Update the Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ak-kalashnikov/nutrition-raqa
          repo_type: space
          space_sdk: docker
          hf_token: ${{ secrets.HF_TOKEN }}
