name: Purge tainted workflow runs

on:
  push:
    paths:
      - .github/workflows/purge-tainted-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs on rewritten Cursor-coauthored commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # SHAs from history before the Co-authored-by: Cursor rewrite
          BAD_PREFIXES='7c6efcd c3e0c0c a5d41ae ce06ded'

          page=1
          deleted=0
          while true; do
            resp="$(gh api "/repos/${GH_REPO}/actions/runs?per_page=100&page=${page}")"
            count="$(echo "$resp" | jq '.workflow_runs | length')"
            if [ "$count" -eq 0 ]; then
              break
            fi
            echo "$resp" | jq -c '.workflow_runs[]' | while read -r run; do
              id="$(echo "$run" | jq -r '.id')"
              sha="$(echo "$run" | jq -r '.head_sha')"
              short="${sha:0:7}"
              name="$(echo "$run" | jq -r '.name')"
              for p in $BAD_PREFIXES; do
                if [ "$short" = "$p" ]; then
                  echo "Deleting run $id ($name @ $short)"
                  gh api -X DELETE "/repos/${GH_REPO}/actions/runs/${id}" || true
                  deleted=$((deleted + 1))
                  break
                fi
              done
            done
            page=$((page + 1))
          done
          echo "Done."
