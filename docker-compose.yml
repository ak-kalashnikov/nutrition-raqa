version: '3.8'

services:
  api:
    build: .
    container_name: raqa-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  demo:
    image: python:3.11-slim
    container_name: raqa-demo
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      bash -c "pip install streamlit requests &&
               streamlit run demo.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api
    environment:
     - STREAMLIT_SERVER_HEADLESS=true
